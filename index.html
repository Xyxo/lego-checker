<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEGO Teile-Checker</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --primary: #d9232e;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 16px; }
    header { max-width: 900px; margin: 0 auto 16px; }
    h1 { font-size: 1.4rem; margin: 0 0 12px; }
    .controls {
      display: grid; gap: 10px; background: var(--card);
      padding: 12px; border-radius: 12px; border: 1px solid var(--border);
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, select {
      flex: 1; min-width: 140px; padding: 10px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 1rem; background: #fff; color: var(--text);
    }
    button {
      padding: 10px 16px; border: none; border-radius: 8px; font-weight: 600;
      cursor: pointer; font-size: 0.95rem; transition: background 0.15s, color 0.15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #e5e7eb; color: var(--text); }

    /* Set-Titel Banner */
    .set-banner {
      max-width: 900px; margin: 14px auto; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; padding: 14px;
      display: none; align-items: center; gap: 14px;
    }
    .set-banner.visible { display: flex; }
    .set-banner img {
      width: 72px; height: 72px; object-fit: contain; border-radius: 8px;
      background: #f9fafb; padding: 4px; flex-shrink: 0;
    }
    .set-banner-info { min-width: 0; }
    .set-banner-title {
      font-size: 1.45rem; font-weight: 800; line-height: 1.2; color: #111827;
      margin: 0 0 4px; word-break: break-word;
    }
    .set-banner-meta {
      font-size: 0.85rem; color: var(--muted); font-weight: 500;
    }

    /* Tabs Styling */
    .tabs {
      display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px;
    }
    .tab-btn {
      flex: 1; background: #f3f4f6; color: var(--muted); border: 1px solid var(--border);
    }
    .tab-btn.active {
      background: #111827; color: #fff; border-color: #111827;
    }

    .status-bar {
      max-width: 900px; margin: 12px auto; display: flex;
      justify-content: space-between; align-items: center; font-size: 0.9rem; color: var(--muted);
    }
    .grid {
      max-width: 900px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px; display: flex; flex-direction: column; align-items: center;
      text-align: center; cursor: pointer; transition: transform 0.12s;
      user-select: none;
    }
    .card:active { transform: scale(0.96); }
    .card.found-card {
      border-color: #10b981; background: #f0fdf4; cursor: default;
    }
    .card.found-card:active { transform: none; }
    .card img { width: 96px; height: 96px; object-fit: contain; margin-bottom: 8px; }
    .qty {
      background: #111827; color: #fff; font-weight: 700; font-size: 0.85rem;
      padding: 2px 10px; border-radius: 999px; margin-bottom: 6px;
    }
    .qty.partial { background: #d97706; }
    .found-card .qty { background: #059669; }
    .name { font-size: 0.8rem; font-weight: 600; line-height: 1.2; margin-bottom: 4px; }
    .color { font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; }
    .btn-card {
      margin-top: auto; width: 100%; padding: 6px 10px; font-size: 0.8rem;
      background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; border-radius: 8px;
    }
    .btn-card:active { background: #e5e7eb; }
    .found-card .btn-card { background: #ffffff; }
    .empty-msg {
      grid-column: 1 / -1; text-align: center; padding: 32px 16px;
      color: var(--muted); font-size: 0.95rem;
    }
    .error { color: #b91c1c; font-weight: 600; max-width: 900px; margin: 8px auto; }
  </style>
</head>
<body>

<header>
  <h1>🧱 LEGO Teile-Checker</h1>
  <div class="controls">
    <div class="row">
      <input type="password" id="apiKey" placeholder="Rebrickable API-Key" />
      <input type="text" id="setNum" placeholder="Set-Nr. (z.B. 70670-1)" />
      <button class="btn-primary" onclick="loadParts()">Laden</button>
      <button class="btn-secondary" onclick="resetSet()">Reset</button>
    </div>
    <div class="row">
      <select id="colorFilter" onchange="onColorChange()">
        <option value="ALL">🎨 Alle Farben</option>
      </select>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tabMissing" onclick="switchTab('missing')">
        🔍 Noch gesucht (<span id="countMissing">0</span>)
      </button>
      <button class="tab-btn" id="tabFound" onclick="switchTab('found')">
        ✅ Gefunden (<span id="countFound">0</span>)
      </button>
    </div>
  </div>
</header>

<section id="setBanner" class="set-banner">
  <img id="setImg" src="" alt="Set Vorschau" />
  <div class="set-banner-info">
    <h2 id="setNameHeading" class="set-banner-title"></h2>
    <div id="setMeta" class="set-banner-meta"></div>
  </div>
</section>

<div id="error" class="error"></div>
<div class="status-bar">
  <span id="counter">Bereit</span>
  <span id="setTitle"></span>
</div>
<main id="grid" class="grid"></main>

<script>
  const WORKER_URL = "https://" + "lively-star-04ab.questtest24.workers.dev";
  let parts = [];
  let foundCounts = {};
  let activeTab = "missing";
  let selectedColor = "ALL";
  let currentSet = "";

  window.onload = () => {
    const savedKey = localStorage.getItem("rb_api_key");
    const savedSet = localStorage.getItem("rb_last_set");
    if (savedKey) document.getElementById("apiKey").value = savedKey;
    if (savedSet) document.getElementById("setNum").value = savedSet;
  };

  function normalizeSetNum(input) {
    const trimmed = input.trim();
    return trimmed.includes("-") ? trimmed : trimmed + "-1";
  }

  function switchTab(tabName) {
    activeTab = tabName;
    document.getElementById("tabMissing").classList.toggle("active", tabName === "missing");
    document.getElementById("tabFound").classList.toggle("active", tabName === "found");
    render();
  }

  function onColorChange() {
    selectedColor = document.getElementById("colorFilter").value;
    render();
  }

  function saveProgress() {
    localStorage.setItem("counts_" + currentSet, JSON.stringify(foundCounts));
  }

  async function loadParts() {
    const apiKey = document.getElementById("apiKey").value.trim();
    const rawSet = document.getElementById("setNum").value.trim();
    const errorEl = document.getElementById("error");
    const bannerEl = document.getElementById("setBanner");
    errorEl.textContent = "";
    bannerEl.classList.remove("visible");

    if (!apiKey || !rawSet) {
      errorEl.textContent = "Bitte API-Key und Set-Nummer eingeben.";
      return;
    }

    currentSet = normalizeSetNum(rawSet);
    localStorage.setItem("rb_api_key", apiKey);
    localStorage.setItem("rb_last_set", currentSet);

    const savedCounts = JSON.parse(localStorage.getItem("counts_" + currentSet) || "null");
    if (savedCounts) {
      foundCounts = savedCounts;
    } else {
      foundCounts = {};
      const oldChecked = JSON.parse(localStorage.getItem("checked_" + currentSet) || "[]");
      oldChecked.forEach(id => { foundCounts[id] = 999999; });
    }

    document.getElementById("counter").textContent = "Lade Set-Infos und Teile...";
    document.getElementById("grid").innerHTML = "";

    const baseApi = "https:" + "//reb" + "rickable." + "com/api/v3/lego/sets/" + encodeURIComponent(currentSet);
    const fallbackImg = "https:" + "//reb" + "rickable." + "com/static/img/nil.png";

    try {
      // 1. Set-Metadaten (Name, Jahr, Bild) abrufen
      const infoUrl = baseApi + "/?key=" + encodeURIComponent(apiKey);
      const infoRes = await fetch(WORKER_URL + "/?url=" + encodeURIComponent(infoUrl));
      if (!infoRes.ok) throw new Error("Fehler " + infoRes.status + ": Set nicht gefunden oder API-Key ungültig.");
      const setInfo = await infoRes.json();

      document.getElementById("setNameHeading").textContent = setInfo.name || ("Set " + currentSet);
      document.getElementById("setMeta").textContent =
        "Set-Nr. " + currentSet + (setInfo.year ? " • Jahr " + setInfo.year : "");
      document.getElementById("setImg").src = setInfo.set_img_url || fallbackImg;
      bannerEl.classList.add("visible");

      // 2. Teileliste abrufen
      let targetUrl = baseApi + "/parts/?page_size=500&key=" + encodeURIComponent(apiKey);
      let allResults = [];

      while (targetUrl) {
        const fetchUrl = WORKER_URL + "/?url=" + encodeURIComponent(targetUrl);
        const res = await fetch(fetchUrl);
        if (!res.ok) throw new Error("Fehler " + res.status + " beim Laden der Teileliste.");

        const data = await res.json();
        allResults = allResults.concat(data.results);

        if (data.next) {
          targetUrl = data.next.includes("key=") ? data.next : data.next + "&key=" + encodeURIComponent(apiKey);
        } else {
          targetUrl = null;
        }
      }

      parts = allResults
        .filter(item => !item.is_spare)
        .sort((a, b) => a.color.name.localeCompare(b.color.name));

      selectedColor = "ALL";
      buildColorDropdown();

      document.getElementById("setTitle").textContent = "Set " + currentSet;
      render();
    } catch (err) {
      errorEl.textContent = err.message;
      document.getElementById("counter").textContent = "Fehler beim Laden";
    }
  }

  function buildColorDropdown() {
    const select = document.getElementById("colorFilter");
