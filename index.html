<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEGO Teile-Checker</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f4f6f8; color: #1f2937; padding: 14px; }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 0 0 10px; }
    .box { background: #fff; padding: 12px; border-radius: 12px; border: 1px solid #e5e7eb; display: grid; gap: 8px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    input, select { flex: 1; min-width: 130px; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; background: #fff; }
    button { padding: 10px 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
    .btn-red { background: #d9232e; color: #fff; }
    .btn-gray { background: #e5e7eb; color: #1f2937; }
    .tabs { display: flex; gap: 6px; border-top: 1px solid #e5e7eb; padding-top: 8px; flex-wrap: wrap; }
    .tab { flex: 1; min-width: 95px; background: #f3f4f6; color: #4b5563; border: 1px solid #e5e7eb; padding: 8px; }
    .tab.active { background: #111827; color: #fff; border-color: #111827; }
    .banner { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; margin-top: 12px; display: none; align-items: center; gap: 12px; }
    .banner.show { display: flex; }
    .banner img { width: 68px; height: 68px; object-fit: contain; background: #f9fafb; border-radius: 8px; }
    .banner h2 { margin: 0 0 4px; font-size: 1.35rem; font-weight: 800; color: #111827; }
    .banner small { color: #6b7280; }
    .status { margin: 10px 0; display: flex; justify-content: space-between; font-size: 0.9rem; color: #6b7280; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 10px; }
    .sec-head { grid-column: 1 / -1; background: #e0e7ff; border-left: 4px solid #4f46e5; padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; color: #1e1b4b; margin-top: 10px; display: flex; align-items: center; gap: 8px; }
    .sec-head.bricks { background: #e5e7eb; border-left-color: #374151; color: #111827; margin-top: 18px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; user-select: none; }
    .card.fig { border: 2px solid #4f46e5; background: #eef2ff; }
    .card.figpart { border-color: #c7d2fe; background: #f8fafc; }
    .card.done { border: 1px solid #10b981; background: #f0fdf4; cursor: default; }
    .card img { width: 90px; height: 90px; object-fit: contain; margin-bottom: 6px; }
    .qty { background: #111827; color: #fff; font-weight: 700; font-size: 0.82rem; padding: 2px 9px; border-radius: 99px; margin-bottom: 5px; }
    .fig .qty { background: #4f46e5; }
    .figpart .qty { background: #6366f1; }
    .qty.part { background: #d97706; }
    .done .qty { background: #059669; }
    .name { font-size: 0.8rem; font-weight: 600; line-height: 1.2; margin-bottom: 3px; }
    .color { font-size: 0.75rem; color: #6b7280; margin-bottom: 6px; }
    .btn-sm { margin-top: auto; width: 100%; padding: 6px; font-size: 0.8rem; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 8px; }
    .set-item { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; margin-bottom: 8px; }
    .set-item img { width: 58px; height: 58px; object-fit: contain; }
    .bar { height: 7px; background: #e5e7eb; border-radius: 99px; overflow: hidden; margin-top: 5px; }
    .bar div { height: 100%; background: #10b981; }
    .err { color: #b91c1c; font-weight: 600; margin-top: 8px; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>🧱 LEGO Teile-Checker</h1>
  <div class="box">
    <div class="row">
      <input type="password" id="apiKey" placeholder="Rebrickable API-Key" />
      <input type="text" id="setNum" placeholder="Set-Nr. (z.B. 70670-1)" />
      <button class="btn-red" onclick="loadParts()">Laden</button>
      <button class="btn-gray" onclick="resetSet()">Reset</button>
    </div>
    <div class="row" id="filterRow">
      <select id="colorFilter" onchange="selectedColor=this.value;render()"><option value="ALL">🎨 Alle Farben & Figuren</option></select>
    </div>
    <div class="tabs">
      <button class="tab active" id="tMiss" onclick="setTab('miss')">🔍 Gesucht (<span id="cMiss">0</span>)</button>
      <button class="tab" id="tDone" onclick="setTab('done')">✅ Gefunden (<span id="cDone">0</span>)</button>
      <button class="tab" id="tSets" onclick="setTab('sets')">📚 Meine Sets (<span id="cSets">0</span>)</button>
    </div>
  </div>
  <div id="banner" class="banner"><img id="bImg" /><div style="min-width:0"><h2 id="bTitle"></h2><small id="bMeta"></small></div></div>
  <div id="err" class="err"></div>
  <div class="status" id="sBar"><span id="counter">Bereit</span><span id="setTitle"></span></div>
  <div id="grid" class="grid"></div>
  <div id="setList" style="display:none"></div>
</div>
<script>
  const WORKER = "https://" + "lively-star-04ab.questtest24.workers.dev";
  const HOST = "https:" + "//reb" + "rickable." + "com";
  let parts = [], counts = {}, tab = "miss", selectedColor = "ALL", curSet = "", curMeta = null;

  window.onload = () => {
    if (localStorage.rb_api_key) apiKey.value = localStorage.rb_api_key;
    if (localStorage.rb_last_set) setNum.value = localStorage.rb_last_set;
    cSets.textContent = Object.keys(JSON.parse(localStorage.rb_sets || "{}")).length;
  };

  function setTab(t) {
    tab = t;
    tMiss.classList.toggle("active", t === "miss");
    tDone.classList.toggle("active", t === "done");
    tSets.classList.toggle("active", t === "sets");
    filterRow.style.display = sBar.style.display = t === "sets" ? "none" : "flex";
    grid.style.display = t === "sets" ? "none" : "grid";
    setList.style.display = t === "sets" ? "block" : "none";
    t === "sets" ? renderSets() : render();
  }

  function syncFigs(changedId) {
    if (changedId && changedId.startsWith("fig_")) {
      const fig = parts.find(p => p.id === changedId);
      if (!fig) return;
      const doneFigs = Math.min(counts[fig.id] || 0, fig.quantity);
      parts.filter(p => p.parentFig === fig.id).forEach(fp => {
        const perFig = fp.quantity / fig.quantity;
        const minNeeded = doneFigs * perFig;
        if (doneFigs === 0) delete counts[fp.id];
        else if ((counts[fp.id] || 0) < minNeeded) counts[fp.id] = minNeeded;
      });
    } else if (changedId && changedId.startsWith("fp_")) {
      const fp = parts.find(p => p.id === changedId);
      const fig = fp && parts.find(p => p.id === fp.parentFig);
      if (!fig) return;
      const children = parts.filter(p => p.parentFig === fig.id);
      if (children.length) {
        let completeFigs = fig.quantity;
        children.forEach(c => {
          const perFig = c.quantity / fig.quantity;
          completeFigs = Math.min(completeFigs, Math.floor((counts[c.id] || 0) / perFig));
        });
        if (completeFigs > 0) counts[fig.id] = completeFigs;
        else delete counts[fig.id];
      }
    }
  }

  function save(changedId) {
    if (changedId) syncFigs(changedId);
    localStorage["counts_" + curSet] = JSON.stringify(counts);
    if (!curSet || !parts.length) return;
    let tot = 0, fnd = 0;
    parts.filter(p => !p.isFig).forEach(p => { tot += p.quantity; fnd += Math.min(counts[p.id] || 0, p.quantity); });
    const sets = JSON.parse(localStorage.rb_sets || "{}");
    sets[curSet] = { set: curSet, ...(curMeta || sets[curSet]), tot, fnd, ts: Date.now() };
    localStorage.rb_sets = JSON.stringify(sets);
    cSets.textContent = Object.keys(sets).length;
  }

  async function fetchAllPages(startUrl, key) {
    let url = startUrl, out = [];
    while (url) {
      const r = await fetch(WORKER + "/?url=" + encodeURIComponent(url));
      if (!r.ok) throw new Error("Fehler " + r.status + " beim Laden.");
      const d = await r.json(); out = out.concat(d.results);
      url = d.next ? (d.next.includes("key=") ? d.next : d.next + "&key=" + encodeURIComponent(key)) : null;
    }
    return out;
  }

  async function loadParts(override) {
    if (override) setNum.value = override;
    const key = apiKey.value.trim(), raw = setNum.value.trim();
    err.textContent = ""; banner.classList.remove("show");
    if (!key || !raw) return (err.textContent = "Bitte API-Key und Set-Nummer eingeben.");
    curSet = raw.includes("-") ? raw : raw + "-1";
    localStorage.rb_api_key = key; localStorage.rb_last_set = curSet;
    if (tab === "sets") setTab("miss");
    counts = JSON.parse(localStorage["counts_" + curSet] || "{}");
    counter.textContent = "Lade Set, Teile & Figuren..."; grid.innerHTML = "";
    const base = HOST + "/api/v3/lego/sets/" + encodeURIComponent(curSet);
    try {
      const r1 = await fetch(WORKER + "/?url=" + encodeURIComponent(base + "/?key=" + encodeURIComponent(key)));
      if (!r1.ok) throw new Error("Fehler " + r1.status + ": Set oder API-Key ungültig.");
      const info = await r1.json();
      curMeta = { name: info.name || curSet, year: info.year || "", img: info.set_img_url || HOST + "/static/img/nil.png" };
      bTitle.textContent = curMeta.name; bMeta.textContent = "Set " + curSet + (curMeta.year ? " • " + curMeta.year : ""); bImg.src = curMeta.img;
      banner.classList.add("show");

      const rawParts = await fetchAllPages(base + "/parts/?page_size=500&key=" + encodeURIComponent(key), key);
      const rawFigs = await fetchAllPages(base + "/minifigs/?page_size=200&key=" + encodeURIComponent(key), key);

      // Systematische Reihenfolge: Figur 1 -> Einzelteile Figur 1 -> Figur 2 -> Einzelteile Figur 2 ...
      const orderedFigs = [];
      for (const f of rawFigs) {
        const figId = "fig_" + f.set_num;
        orderedFigs.push({ id: figId, isFig: true, figGroup: f.set_name, quantity: f.quantity, part: { name: f.set_name, part_img_url: f.set_img_url }, color: { name: "🧍 Minifiguren" } });
        const fUrl = HOST + "/api/v3/lego/minifigs/" + encodeURIComponent(f.set_num) + "/parts/?page_size=200&key=" + encodeURIComponent(key);
        const fParts = await fetchAllPages(fUrl, key);
        fParts.filter(fp => !fp.is_spare).forEach(fp => {
          orderedFigs.push({ id: "fp_" + f.set_num + "_" + fp.id, isFigPart: true, parentFig: figId, figGroup: f.set_name, quantity: fp.quantity * f.quantity, part: fp.part, color: fp.color });
        });
      }

      const normalParts = rawParts.filter(i => !i.is_spare).sort((a, b) => a.color.name.localeCompare(b.color.name));
      parts = orderedFigs.concat(normalParts);
      selectedColor = "ALL";
      const cols = {};
      parts.forEach(p => {
        cols[p.color.name] = (cols[p.color.name] || 0) + p.quantity;
        if (p.isFigPart) cols["🧩 Figuren-Teile"] = (cols["🧩 Figuren-Teile"] || 0) + p.quantity;
      });
      colorFilter.innerHTML = '<option value="ALL">🎨 Alle Farben & Figuren (' + parts.length + ')</option>' +
        Object.keys(cols).sort().map(c => '<option value="' + c + '">' + c + ' (' + cols[c] + ')</option>').join("");
      save(); setTitle.textContent = "Set " + curSet; render();
    } catch (e) { err.textContent = e.message; counter.textContent = "Fehler"; }
  }

  function resetSet() {
    if (!curSet || !confirm("Set " + curSet + " wirklich zurücksetzen?")) return;
    counts = {}; save(); render();
  }

  function renderSets() {
    const list = Object.values(JSON.parse(localStorage.rb_sets || "{}")).sort((a, b) => b.ts - a.ts);
    setList.innerHTML = list.length ? "" : "<p style='text-align:center;color:#6b7280'>Noch keine Sets gespeichert.</p>";
    list.forEach(s => {
      const pct = s.tot ? Math.round((s.fnd / s.tot) * 100) : 0;
      const d = document.createElement("div"); d.className = "set-item"; d.onclick = () => loadParts(s.set);
      d.innerHTML = '<img src="' + s.img + '"><div style="flex:1;min-width:0"><b>' + s.name + '</b><br><small>Set ' + s.set + ' • ' + s.fnd + '/' + s.tot + ' (' + pct + '%)</small><div class="bar"><div style="width:' + pct + '%"></div></div></div>';
      const del = document.createElement("button"); del.textContent = "🗑️"; del.style.background = "#fee2e2";
      del.onclick = e => { e.stopPropagation(); if (confirm(s.name + " löschen?")) { const all = JSON.parse(localStorage.rb_sets || "{}"); delete all[s.set]; localStorage.rb_sets = JSON.stringify(all); delete localStorage["counts_" + s.set]; cSets.textContent = Object.keys(all).length; renderSets(); } };
      d.appendChild(del); setList.appendChild(d);
    });
  }

  function render() {
    grid.innerHTML = "";
    let tot = 0, fnd = 0;
    parts.filter(p => !p.isFig).forEach(p => { tot += p.quantity; fnd += Math.min(counts[p.id] || 0, p.quantity); });
    const filtered = selectedColor === "ALL" ? parts
      : (selectedColor === "🧩 Figuren-Teile" ? parts.filter(p => p.isFigPart) : parts.filter(p => p.color.name === selectedColor));
    const miss = filtered.filter(p => (counts[p.id] || 0) < p.quantity);
    const done = filtered.filter(p => (counts[p.id] || 0) >= p.quantity);
    cMiss.textContent = miss.length; cDone.textContent = done.length;
    counter.textContent = "Gesamt: " + fnd + " / " + tot + " Steine";

    let lastGroup = null, bricksHeaderAdded = false;
    (tab === "miss" ? miss : done).forEach(item => {
      // Gruppen-Überschrift pro Figur bzw. vor den regulären Set-Steinen
      if (item.figGroup && item.figGroup !== lastGroup) {
        const h = document.createElement("div"); h.className = "sec-head";
        h.textContent = "🧍 " + item.figGroup; grid.appendChild(h);
        lastGroup = item.figGroup;
      } else if (!item.figGroup && !bricksHeaderAdded && lastGroup !== null) {
        const h = document.createElement("div"); h.className = "sec-head bricks";
        h.textContent = "🧱 Reguläre Set-Steine"; grid.appendChild(h);
        bricksHeaderAdded = true;
      }

      const dQty = Math.min(counts[item.id] || 0, item.quantity), rem = item.quantity - dQty, isDone = tab === "done";
      const card = document.createElement("div");
      card.className = "card" + (isDone ? " done" : (item.isFig ? " fig" : (item.isFigPart ? " figpart" : "")));
      card.innerHTML = '<img src="' + (item.part.part_img_url || HOST + "/static/img/nil.png") + '" loading="lazy">' +
        '<div class="qty' + (!isDone && dQty ? ' part' : '') + '">' + (isDone ? item.quantity + 'x' : (dQty ? rem + '/' + item.quantity : item.quantity + 'x')) + '</div>' +
        '<div class="name">' + item.part.name + '</div><div class="color">' + item.color.name + '</div>';
      if (isDone) {
        const b = document.createElement("button"); b.className = "btn-sm"; b.textContent = "↩️ Zurück";
        b.onclick = () => { if (confirm(item.part.name + " zurückschieben?")) { delete counts[item.id]; save(item.id); render(); } };
        card.appendChild(b);
      } else {
