<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LEGO Teile-Checker</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{margin:0;background:#f4f6f8;color:#1f2937;padding:14px}
.w{max-width:900px;margin:0 auto}
h1{font-size:1.35rem;margin:0 0 10px}
.bx{background:#fff;padding:12px;border-radius:12px;border:1px solid #e5e7eb;display:grid;gap:8px}
.rw{display:flex;gap:8px;flex-wrap:wrap}
input,select{flex:1;min-width:130px;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:1rem;background:#fff}
button{padding:10px 14px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:.9rem}
.br{background:#d9232e;color:#fff}
.bg{background:#e5e7eb;color:#1f2937}
.tbs{display:flex;gap:6px;border-top:1px solid #e5e7eb;padding-top:8px;flex-wrap:wrap}
.tb{flex:1;min-width:95px;background:#f3f4f6;color:#4b5563;border:1px solid #e5e7eb;padding:8px}
.tb.on{background:#111827;color:#fff;border-color:#111827}
.bn{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:12px;display:none;align-items:center;gap:12px}
.bn.on{display:flex}
.bn img{width:68px;height:68px;object-fit:contain;background:#f9fafb;border-radius:8px}
.bn h2{margin:0 0 4px;font-size:1.35rem;font-weight:800}
.st{margin:10px 0;display:flex;justify-content:space-between;font-size:.9rem;color:#6b7280}
.gd{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.sh{grid-column:1/-1;background:#e0e7ff;border-left:4px solid #4f46e5;padding:8px 12px;border-radius:8px;font-weight:700;font-size:.95rem;color:#1e1b4b;margin-top:10px}
.sh.bk{background:#e5e7eb;border-left-color:#374151;color:#111827;margin-top:18px}
.cd{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;user-select:none}
.cd.fg{border:2px solid #4f46e5;background:#eef2ff}
.cd.fp{border-color:#c7d2fe;background:#f8fafc}
.cd.dn{border:1px solid #10b981;background:#f0fdf4;cursor:default}
.cd img{width:90px;height:90px;object-fit:contain;margin-bottom:6px}
.qt{background:#111827;color:#fff;font-weight:700;font-size:.82rem;padding:2px 9px;border-radius:99px;margin-bottom:5px}
.fg .qt{background:#4f46e5}.fp .qt{background:#6366f1}.qt.pt{background:#d97706}.dn .qt{background:#059669}
.nm{font-size:.8rem;font-weight:600;line-height:1.2;margin-bottom:3px}
.cl{font-size:.75rem;color:#6b7280;margin-bottom:6px}
.bs{margin-top:auto;width:100%;padding:6px;font-size:.8rem;background:#f3f4f6;border:1px solid #d1d5db;border-radius:8px}
.si{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:8px}
.si img{width:58px;height:58px;object-fit:contain}
.br2{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:5px}
.br2 div{height:100%;background:#10b981}
.er{color:#b91c1c;font-weight:600;margin-top:8px}
</style>
</head>
<body>
<div class="w">
  <h1>🧱 LEGO Teile-Checker</h1>
  <div class="bx">
    <div class="rw">
      <input type="password" id="apiKey" placeholder="API-Key"/>
      <input type="text" id="setNum" placeholder="Set-Nr. (70670-1)"/>
      <button class="br" onclick="loadParts()">Laden</button>
      <button class="bg" onclick="resetSet()">Reset</button>
    </div>
    <div class="rw" id="fRow">
      <select id="cFil" onchange="sCol=this.value;render()"><option value="ALL">🎨 Alle Farben & Figuren</option></select>
    </div>
    <div class="tbs">
      <button class="tb on" id="tM" onclick="setTab('miss')">🔍 Gesucht (<span id="cM">0</span>)</button>
      <button class="tb" id="tD" onclick="setTab('done')">✅ Gefunden (<span id="cD">0</span>)</button>
      <button class="tb" id="tS" onclick="setTab('sets')">📚 Meine Sets (<span id="cS">0</span>)</button>
    </div>
  </div>
  <div id="bn" class="bn"><img id="bI"/><div style="min-width:0"><h2 id="bT"></h2><small id="bM" style="color:#6b7280"></small></div></div>
  <div id="er" class="er"></div>
  <div class="st" id="sBar"><span id="cnt">Bereit</span><span id="sTit"></span></div>
  <div id="gd" class="gd"></div>
  <div id="sLst" style="display:none"></div>
</div>
<script>
const W="https://"+"lively-star-04ab.questtest24.workers.dev";
const H="https:"+"//reb"+"rickable."+"com";
const K="44df6b43f63c0f40b9432167bc731b84";
let parts=[],counts={},tab="miss",sCol="ALL",cSet="",cMeta=null;

window.onload=()=>{
  apiKey.value=localStorage.rb_api_key||K;
  if(localStorage.rb_last_set)setNum.value=localStorage.rb_last_set;
  cS.textContent=Object.keys(JSON.parse(localStorage.rb_sets||"{}")).length;
};

function setTab(t){
  tab=t;
  tM.classList.toggle("on",t==="miss");
  tD.classList.toggle("on",t==="done");
  tS.classList.toggle("on",t==="sets");
  fRow.style.display=sBar.style.display=t==="sets"?"none":"flex";
  gd.style.display=t==="sets"?"none":"grid";
  sLst.style.display=t==="sets"?"block":"none";
  t==="sets"?renderSets():render();
}

function sync(id){
  if(!id)return;
  if(id.startsWith("fig_")){
    const f=parts.find(p=>p.id===id);if(!f)return;
    const d=Math.min(counts[f.id]||0,f.quantity);
    parts.filter(p=>p.pFig===f.id).forEach(x=>{
      const m=d*(x.quantity/f.quantity);
      if(!d)delete counts[x.id];else if((counts[x.id]||0)<m)counts[x.id]=m;
    });
  }else if(id.startsWith("fp_")){
    const x=parts.find(p=>p.id===id),f=x&&parts.find(p=>p.id===x.pFig);if(!f)return;
    const ch=parts.filter(p=>p.pFig===f.id);
    if(ch.length){
      let c=f.quantity;
      ch.forEach(k=>c=Math.min(c,Math.floor((counts[k.id]||0)/(k.quantity/f.quantity))));
      c>0?counts[f.id]=c:delete counts[f.id];
    }
  }
}

function save(id){
  sync(id);
  localStorage["counts_"+cSet]=JSON.stringify(counts);
  if(!cSet||!parts.length)return;
  let t=0,f=0;
  parts.filter(p=>!p.isFig).forEach(p=>{t+=p.quantity;f+=Math.min(counts[p.id]||0,p.quantity)});
  const s=JSON.parse(localStorage.rb_sets||"{}");
  s[cSet]={set:cSet,...(cMeta||s[cSet]),tot:t,fnd:f,ts:Date.now()};
  localStorage.rb_sets=JSON.stringify(s);
  cS.textContent=Object.keys(s).length;
}

async function fAll(u,k){
  let o=[];
  while(u){
    const r=await fetch(W+"/?url="+encodeURIComponent(u));
    if(!r.ok)throw new Error("Fehler "+r.status);
    const d=await r.json();o=o.concat(d.results);
    u=d.next?(d.next.includes("key=")?d.next:d.next+"&key="+encodeURIComponent(k)):null;
  }
  return o;
}

async function loadParts(ov){
  if(ov)setNum.value=ov;
  const k=apiKey.value.trim(),rw=setNum.value.trim();
  er.textContent="";bn.classList.remove("on");
  if(!k||!rw)return er.textContent="Key & Set eingeben.";
  cSet=rw.includes("-")?rw:rw+"-1";
  localStorage.rb_api_key=k;localStorage.rb_last_set=cSet;
  if(tab==="sets")setTab("miss");
  counts=JSON.parse(localStorage["counts_"+cSet]||"{}");
  cnt.textContent="Lade...";gd.innerHTML="";
  const b=H+"/api/v3/lego/sets/"+encodeURIComponent(cSet);
  try{
    const r1=await fetch(W+"/?url="+encodeURIComponent(b+"/?key="+encodeURIComponent(k)));
    if(!r1.ok)throw new Error("Fehler "+r1.status);
    const inf=await r1.json();
    cMeta={name:inf.name||cSet,year:inf.year||"",img:inf.set_img_url||H+"/static/img/nil.png"};
    bT.textContent=cMeta.name;bM.textContent="Set "+cSet+(cMeta.year?" • "+cMeta.year:"");bI.src=cMeta.img;
    bn.classList.add("on");
    const rp=await fAll(b+"/parts/?page_size=500&key="+encodeURIComponent(k),k);
    const rf=await fAll(b+"/minifigs/?page_size=200&key="+encodeURIComponent(k),k);
    const of=[];
    for(const f of rf){
      const fid="fig_"+f.set_num;
      of.push({id:fid,isFig:1,fg:f.set_name,quantity:f.quantity,part:{name:f.set_name,part_img_url:f.set_img_url},color:{name:"🧍 Minifiguren"}});
      const fp=await fAll(H+"/api/v3/lego/minifigs/"+encodeURIComponent(f.set_num)+"/parts/?page_size=200&key="+encodeURIComponent(k),k);
      fp.filter(x=>!x.is_spare).forEach(x=>of.push({id:"fp_"+f.set_num+"_"+x.id,isFP:1,pFig:fid,fg:f.set_name,quantity:x.quantity*f.quantity,part:x.part,color:x.color}));
    }
    parts=of.concat(rp.filter(i=>!i.is_spare).sort((a,b)=>a.color.name.localeCompare(b.color.name)));
    sCol="ALL";
    const cl={};
    parts.forEach(p=>{
      cl[p.color.name]=(cl[p.color.name]||0)+p.quantity;
      if(p.isFP)cl["🧩 Figuren-Teile"]=(cl["🧩 Figuren-Teile"]||0)+p.quantity;
    });
    cFil.innerHTML='<option value="ALL">🎨 Alle ('+parts.length+')</option>'+Object.keys(cl).sort().map(c=>'<option value="'+c+'">'+c+' ('+cl[c]+')</option>').join("");
    save();sTit.textContent="Set "+cSet;render();
  }catch(e){er.textContent=e.message;cnt.textContent="Fehler"}
}

function resetSet(){if(cSet&&confirm("Set "+cSet+" zurücksetzen?")){counts={};save();render()}}

function renderSets(){
  const l=Object.values(JSON.parse(localStorage.rb_sets||"{}")).sort((a,b)=>b.ts-a.ts);
  sLst.innerHTML=l.length?"":"<p style='text-align:center;color:#6b7280'>Keine Sets.</p>";
  l.forEach(s=>{
    const pc=s.tot?Math.round(s.fnd/s.tot*100):0,d=document.createElement("div");
    d.className="si";d.onclick=()=>loadParts(s.set);
    d.innerHTML='<img src="'+s.img+'"><div style="flex:1;min-width:0"><b>'+s.name+'</b><br><small>'+s.set+' • '+s.fnd+'/'+s.tot+' ('+pc+'%)</small><div class="br2"><div style="width:'+pc+'%"></div></div></div>';
    const dl=document.createElement("button");dl.textContent="🗑️";dl.style.background="#fee2e2";
    dl.onclick=e=>{e.stopPropagation();if(confirm(s.name+" löschen?")){const a=JSON.parse(localStorage.rb_sets||"{}");delete a[s.set];localStorage.rb_sets=JSON.stringify(a);delete localStorage["counts_"+s.set];cS.textContent=Object.keys(a).length;renderSets()}};
    d.appendChild(dl);sLst.appendChild(d);
  });
}

function render(){
  gd.innerHTML="";let t=0,f=0;
  parts.filter(p=>!p.isFig).forEach(p=>{t+=p.quantity;f+=Math.min(counts[p.id]||0,p.quantity)});
  const fl=sCol==="ALL"?parts:(sCol==="🧩 Figuren-Teile"?parts.filter(p=>p.isFP):parts.filter(p=>p.color.name===sCol));
  const ms=fl.filter(p=>(counts[p.id]||0)<p.quantity),dn=fl.filter(p=>(counts[p.id]||0)>=p.quantity);
  cM.textContent=ms.length;cD.textContent=dn.length;cnt.textContent="Gesamt: "+f+" / "+t+" Steine";
  let lg=null,bh=0;
  (tab==="miss"?ms:dn).forEach(i=>{
    if(i.fg&&i.fg!==lg){const h=document.createElement("div");h.className="sh";h.textContent="🧍 "+i.fg;gd.appendChild(h);lg=i.fg}
    else if(!i.fg&&!bh&&lg!==null){const h=document.createElement("div");h.className="sh bk";h.textContent="🧱 Reguläre Set-Steine";gd.appendChild(h);bh=1}
    const dq=Math.min(counts[i.id]||0,i.quantity),rm=i.quantity-dq,idn=tab==="done",c=document.createElement("div");
    c.className="cd"+(idn?" dn":(i.isFig?" fg":(i.isFP?" fp":"")));
    c.innerHTML='<img src="'+(i.part.part_img_url||H+"/static/img/nil.png")+'" loading="lazy"><div class="qt'+(!idn&&dq?' pt':'')+'">'+(idn?i.quantity+'x':(dq?rm+'/'+i.quantity:i.quantity+'x'))+'</div><div class="nm">'+i.part.name+'</div><div class="cl">'+i.color.name+'</div>';
    if(idn){
      const b=document.createElement("button");b.className="bs";b.textContent="↩️ Zurück";
      b.onclick=()=>{if(confirm(i.part.name+" zurück?")){delete counts[i.id];save(i.id);render()}};
      c.appendChild(b);
    }else{
      c.onclick=()=>{counts[i.id]=dq+1;save(i.id);render()};
      if(rm>1){
        const b=document.createElement("button");b.className="bs";b.textContent="✓ Alle ("+rm+")";
        b.onclick=e=>{e.stopPropagation();counts[i.id]=i.quantity;save(i.id);render()};
        c.appendChild(b);
      }
    }
    gd.appendChild(c);
  });
}
</script>
</body>
</html>
