<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LEGO Teile-Checker</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}body{margin:0;background:#f4f6f8;color:#1f2937;padding:12px}
.w{max-width:900px;margin:0 auto}h1{font-size:1.3rem;margin:0 0 8px}
.bx,.bn,.si,.cd,.amz{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px}
.bx{display:grid;gap:8px}.rw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.swrap{position:relative;flex:1;min-width:140px;display:flex}.swrap input{width:100%}
.ac{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #d1d5db;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.12);z-index:50;max-height:260px;overflow-y:auto;margin-top:4px;display:none}
.ac.on{display:block}.aci{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #f3f4f6;cursor:pointer;font-size:.86rem}
.aci:last-child{border-bottom:none}.aci:hover{background:#f9fafb}.aci img{width:38px;height:38px;object-fit:contain;flex-shrink:0}
input,select{flex:1;min-width:110px;padding:9px;border:1px solid #d1d5db;border-radius:8px;font-size:.95rem;background:#fff}
button{padding:9px 12px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:.88rem;transition:all .15s}
.br{background:#d9232e;color:#fff}.bg{background:#e5e7eb;color:#1f2937}.bbl{background:#2563eb;color:#fff}
.allr{display:flex;align-items:center;gap:8px;padding:2px 0}
.ball{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:#f3f4f6;color:#9ca3af;border:1px solid #d1d5db;border-radius:8px;font-size:1rem;flex-shrink:0}
.ball.arm{background:#059669;color:#fff;border-color:#047857}.allt{font-size:.82rem;color:#6b7280;user-select:none}
.tbs{display:flex;gap:6px;border-top:1px solid #e5e7eb;padding-top:8px}.tb{flex:1;background:#f3f4f6;color:#4b5563;border:1px solid #e5e7eb}
.tb.on{background:#111827;color:#fff;border-color:#111827}.bn{margin-top:10px;display:none;align-items:center;gap:10px}.bn.on{display:flex}
.bn img{width:64px;height:64px;object-fit:contain}.bn h2{margin:0 0 2px;font-size:1.25rem}
.st{margin:8px 0;display:flex;justify-content:space-between;font-size:.88rem;color:#6b7280}
.gd{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}
.sh{grid-column:1/-1;background:#e0e7ff;border-left:4px solid #4f46e5;padding:7px 10px;border-radius:8px;font-weight:700;margin-top:8px}
.sh.bk{background:#e5e7eb;border-left-color:#374151;margin-top:14px}
.cd{display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;user-select:none}
.cd.fg{border:2px solid #4f46e5;background:#eef2ff}.cd.fp{border-color:#c7d2fe;background:#f8fafc}.cd.dn{border-color:#10b981;background:#f0fdf4;cursor:default}
.cd img{width:84px;height:84px;object-fit:contain;margin-bottom:4px}
.qt{background:#111827;color:#fff;font-weight:700;font-size:.82rem;padding:2px 9px;border-radius:99px;margin-bottom:4px}
.fg .qt{background:#4f46e5}.fp .qt{background:#6366f1}.qt.pt{background:#d97706}.dn .qt{background:#059669}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-bottom:5px;max-width:120px}
.dot{width:9px;height:9px;border-radius:50%;background:#e5e7eb;border:1px solid #cbd5e1}.dot.ok{background:#10b981;border-color:#059669}
.pbar{width:100%;margin-bottom:5px}.pbar-t{font-size:.7rem;color:#059669;font-weight:700;margin-bottom:2px}
.pbar-b{height:5px;background:#e5e7eb;border-radius:99px;overflow:hidden}.pbar-b div{height:100%;background:#10b981}
.nm{font-size:.78rem;font-weight:600;line-height:1.2;margin-bottom:2px}.cl{font-size:.72rem;color:#6b7280;margin-bottom:6px}
.brow{margin-top:auto;width:100%;display:flex;gap:4px}.bs{flex:1;padding:5px 4px;font-size:.76rem;background:#f3f4f6;border:1px solid #d1d5db}
.bs.undo{flex:0 0 32px;background:#fef3c7;border-color:#fcd34d;color:#92400e}
.si{display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:8px}.si img{width:50px;height:50px;object-fit:contain}
.amz-ic{width:34px;height:34px;border-radius:8px;background:#ff9900;color:#111827;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;text-decoration:none}
.br2{height:6px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:4px}.br2 div{height:100%;background:#10b981}.er{color:#b91c1c;font-weight:600;margin-top:6px}
.amz{margin-top:24px;display:none;align-items:center;justify-content:space-between;gap:10px;font-size:.85rem}.amz.on{display:flex}
.amz a{background:#ff9900;color:#111827;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<div class="w">
  <h1>🧱 LEGO Teile-Checker</h1>
  <div class="bx">
    <div class="rw">
      <input type="password" id="apiKey" placeholder="Rebrickable API-Key"/>
      <div class="swrap"><input type="text" id="setNum" placeholder="Set-Nr. oder Name..." autocomplete="off" oninput="onSearchInput(this.value)"/><div id="acList" class="ac"></div></div>
      <button class="br" onclick="loadParts()">Laden</button><button class="bg" onclick="resetSet()">Reset</button>
    </div>
    <div class="tbs"><button class="tb on" id="tM" onclick="setTab('miss')">🔍 Gesucht (<span id="cM">0</span>)</button><button class="tb" id="tD" onclick="setTab('done')">✅ Gefunden (<span id="cD">0</span>)</button><button class="tb" id="tS" onclick="setTab('sets')">📚 Sets (<span id="cS">0</span>)</button></div>
    <div class="allr" id="allBox"><button class="ball" id="bAll" onclick="clickAllBtn()">✓</button><span class="allt" id="tAll">Alle als gefunden markieren</span></div>
    <div class="rw" id="fRow"><select id="cFil" onchange="sCol=this.value;render()"><option value="ALL">🎨 Alle</option></select></div>
  </div>
  <div id="bn" class="bn"><img id="bI"/><div><h2 id="bT"></h2><small id="bM" style="color:#6b7280"></small></div></div>
  <div id="er" class="er"></div>
  <div class="st" id="sBar"><span id="cnt">Bereit</span><span id="sTit"></span></div>
  <div id="gd" class="gd"></div>
  <div id="sWrap" style="display:none;margin-top:10px">
    <div class="rw" style="margin-bottom:6px"><button class="bbl" style="flex:1" onclick="exportBackup()">💾 Backup speichern</button><button class="bg" style="flex:1" onclick="impFile.click()">📂 Backup laden</button><input type="file" id="impFile" style="display:none" onchange="importBackup(this)"/></div>
    <div style="font-size:.75rem;color:#6b7280;margin-bottom:8px;text-align:right">a = Anzeige / Affiliate-Link (Amazon.de)</div>
    <div id="sLst"></div>
  </div>
  <div id="amzBox" class="amz"><div><b id="amzTxt">Set auf Amazon ansehen</b><br><small style="color:#6b7280">Anzeige • Affiliate-Link</small></div><a id="amzLnk" href="#" target="_blank" rel="nofollow sponsored noopener">🛒 Bei Amazon öffnen</a></div>
</div>
<script>
const H="https:"+"//reb"+"rickable."+"com",AMZ_TAG="noreferer-21";
const AMZ_SVG='<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><text x="5" y="15" font-family="Arial,sans-serif" font-weight="900" font-size="16" fill="#111827">a</text><path d="M4 17.5C8.5 20.5 15.5 20.5 20 17.2M18.2 16.3L20.4 17L19.5 19.2" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let parts=[],counts={},tab="miss",sCol="ALL",cSet="",cMeta=null,allArmed=false,armTimer=null,acTimer=null;
window.onload=()=>{if(localStorage.rb_api_key)apiKey.value=localStorage.rb_api_key;if(localStorage.rb_last_set)setNum.value=localStorage.rb_last_set;cS.textContent=Object.keys(JSON.parse(localStorage.rb_sets||"{}")).length};
document.addEventListener("click",e=>{if(!e.target.closest(".swrap"))acList.classList.remove("on")});
function apiGet(url,k){return fetch(url,{headers:{"Authorization":"key "+k,"Accept":"application/json"}})}
function amzUrl(setNum,name){const cl=String(setNum).split("-");return"https://www.am"+"azon.de/s?k="+encodeURIComponent("LEGO "+cl+" "+(name||""))+"&tag="+encodeURIComponent(AMZ_TAG)}
function onSearchInput(v){clearTimeout(acTimer);const q=v.trim(),k=apiKey.value.trim();if(q.length<3||!k){acList.classList.remove("on");return}acTimer=setTimeout(async()=>{try{const r=await apiGet(H+"/api/v3/lego/sets/?search="+encodeURIComponent(q)+"&page_size=7",k);if(!r.ok){acList.classList.remove("on");return}const d=await r.json();if(!d.results||!d.results.length){acList.classList.remove("on");return}acList.innerHTML="";d.results.forEach(s=>{const it=document.createElement("div");it.className="aci";it.innerHTML='<img src="'+(s.set_img_url||H+"/static/img/nil.png")+'"><div><b>'+s.set_num+'</b> – '+s.name+'<br><small style="color:#6b7280">'+(s.year||"")+' • '+(s.num_parts||0)+' Teile</small></div>';it.onclick=()=>{acList.classList.remove("on");loadParts(s.set_num)};acList.appendChild(it)});acList.classList.add("on")}catch(e){acList.classList.remove("on")}},450)}
function disarmAll(){allArmed=false;clearTimeout(armTimer);bAll.classList.remove("arm");bAll.textContent="✓";tAll.textContent="Alle als gefunden markieren";tAll.style.color="#6b7280"}
function clickAllBtn(){if(!cSet||!parts.length)return;if(!allArmed){allArmed=true;bAll.classList.add("arm");bAll.textContent="!";tAll.textContent="Nochmal auf das grüne Feld tippen zum Bestätigen";tAll.style.color="#059669";armTimer=setTimeout(disarmAll,4000);return}disarmAll();parts.forEach(p=>counts[p.id]=p.quantity);save();render()}
function setTab(t){tab=t;disarmAll();tM.classList.toggle("on",t==="miss");tD.classList.toggle("on",t==="done");tS.classList.toggle("on",t==="sets");fRow.style.display=sBar.style.display=t==="sets"?"none":"flex";allBox.style.display=t==="miss"?"flex":"none";gd.style.display=t==="sets"?"none":"grid";sWrap.style.display=t==="sets"?"block":"none";t==="sets"?renderSets():render()}
function sync(id){if(id==null)return;const sid=String(id);if(sid.startsWith("fig_")){const f=parts.find(p=>String(p.id)===sid);if(!f)return;const d=Math.min(counts[f.id]||0,f.quantity);parts.filter(p=>p.pFig===f.id).forEach(x=>{const m=d*(x.quantity/f.quantity);if(!d)delete counts[x.id];else if((counts[x.id]||0)<m)counts[x.id]=m})}else if(sid.startsWith("fp_")){const x=parts.find(p=>String(p.id)===sid),f=x&&parts.find(p=>p.id===x.pFig);if(!f)return;const ch=parts.filter(p=>p.pFig===f.id);if(ch.length){let c=f.quantity;ch.forEach(k=>c=Math.min(c,Math.floor((counts[k.id]||0)/(k.quantity/f.quantity))));if(c>0)counts[f.id]=c;else delete counts[f.id]}}}
function save(id){if(id!=null)sync(id);localStorage["counts_"+cSet]=JSON.stringify(counts);if(!cSet||!parts.length)return;let t=0,f=0;parts.filter(p=>!p.isFig).forEach(p=>{t+=p.quantity;f+=Math.min(counts[p.id]||0,p.quantity)});const s=JSON.parse(localStorage.rb_sets||"{}");s[cSet]={set:cSet,...(cMeta||s[cSet]),tot:t,fnd:f,ts:Date.now()};localStorage.rb_sets=JSON.stringify(s);cS.textContent=Object.keys(s).length}
async function fAll(u,k){let o=[];while(u){const r=await apiGet(u,k);if(!r.ok)throw new Error("Fehler "+r.status);const d=await r.json();o=o.concat(d.results);u=d.next;if(u)await wait(200)}return o}
async function loadParts(ov){if(ov)setNum.value=ov;clearTimeout(acTimer);acList.classList.remove("on");const k=apiKey.value.trim(),rw=setNum.value.trim();er.textContent="";bn.classList.remove("on");amzBox.classList.remove("on");disarmAll();if(!k||!rw)return er.textContent="Bitte Rebrickable API-Key & Set-Nr. eingeben.";cSet=rw.includes("-")?rw:rw+"-1";localStorage.rb_api_key=k;localStorage.rb_last_set=cSet;if(tab==="sets")setTab("miss");counts=JSON.parse(localStorage["counts_"+cSet]||"{}");cnt.textContent="Lade Set...";gd.innerHTML="";const b=H+"/api/v3/lego/sets/"+encodeURIComponent(cSet);try{const r1=await apiGet(b+"/",k);if(!r1.ok)throw new Error("Fehler "+r1.status+": Set oder API-Key ungültig.");const inf=await r1.json();cMeta={name:inf.name||cSet,year:inf.year||"",img:inf.set_img_url||H+"/static/img/nil.png"};bT.textContent=cMeta.name;bM.textContent="Set "+cSet+(cMeta.year?" • "+cMeta.year:"");bI.src=cMeta.img;bn.classList.add("on");amzTxt.textContent="LEGO "+cSet.split("-")+" – "+cMeta.name;amzLnk.href=amzUrl(cSet,inf.name);amzBox.classList.add("on");cnt.textContent="Lade Teileliste...";const rp=await fAll(b+"/parts/?page_size=500",k);cnt.textContent="Lade Figuren...";const rf=await fAll(b+"/minifigs/?page_size=200",k),of=[];for(let idx=0;idx<rf.length;idx++){const f=rf[idx],fid="fig_"+f.set_num;of.push({id:fid,isFig:1,fg:f.set_name,quantity:f.quantity,part:{name:f.set_name,part_img_url:f.set_img_url},color:{name:"🧍 Minifiguren"}});await wait(200);const fp=await fAll(H+"/api/v3/lego/minifigs/"+encodeURIComponent(f.set_num)+"/parts/?page_size=200",k);fp.filter(x=>!x.is_spare).forEach(x=>of.push({id:"fp_"+f.set_num+"_"+x.id,isFP:1,pFig:fid,fg:f.set_name,quantity:x.quantity*f.quantity,part:x.part,color:x.color}))}parts=of.concat(rp.filter(i=>!i.is_spare).sort((a,b)=>a.color.name.localeCompare(b.color.name)));sCol="ALL";const cl={};parts.forEach(p=>{cl[p.color.name]=(cl[p.color.name]||0)+p.quantity;if(p.isFP)cl["🧩 Figuren-Teile"]=(cl["🧩 Figuren-Teile"]||0)+p.quantity});cFil.innerHTML='<option value="ALL">🎨 Alle ('+parts.length+')</option>'+Object.keys(cl).sort().map(c=>'<option value="'+c+'">'+c+' ('+cl[c]+')</option>').join("");save();sTit.textContent="Set "+cSet;render()}catch(e){er.textContent=e.message;cnt.textContent="Fehler"}}
function resetSet(){if(cSet&&confirm("Set "+cSet+" zurücksetzen?")){counts={};save();render()}}
function exportBackup(){const s=JSON.parse(localStorage.rb_sets||"{}"),c={};Object.keys(s).forEach(k=>c[k]=JSON.parse(localStorage["counts_"+k]||"{}"));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({v:1,sets:s,counts:c})],{type:"application/json"}));a.download="lego-backup-"+new Date().toISOString().slice(0,10)+".json";a.click()}
function importBackup(i){try{const f=i.files.item(0);if(!f)return;const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d.sets||!d.counts)throw new Error("Ungültig");const s=Object.assign(JSON.parse(localStorage.rb_sets||"{}"),d.sets);localStorage.rb_sets=JSON.stringify(s);Object.keys(d.counts).forEach(k=>localStorage["counts_"+k]=JSON.stringify(d.counts[k]));if(cSet&&d.counts[cSet])counts=d.counts[cSet];cS.textContent=Object.keys(s).length;renderSets();alert("Import erfolgreich!")}catch(x){alert("Fehler: "+x.message)}i.value=""};r.readAsText(f)}catch(y){alert("Dateifehler: "+y.message)}}
function renderSets(){const l=Object.values(JSON.parse(localStorage.rb_sets||"{}")).sort((a,b)=>b.ts-a.ts);sLst.innerHTML=l.length?"":"<p style='text-align:center;color:#6b7280'>Keine Sets.</p>";l.forEach(s=>{const pc=s.tot?Math.round(s.fnd/s.tot*100):0,d=document.createElement("div");d.className="si";d.onclick=()=>loadParts(s.set);const az=document.createElement("a");az.className="amz-ic";az.href=amzUrl(s.set,s.name);az.target="_blank";az.rel="nofollow sponsored noopener";az.title="Bei Amazon öffnen (Anzeige)";az.innerHTML=AMZ_SVG;az.onclick=e=>e.stopPropagation();d.appendChild(az);const info=document.createElement("div");info.style.cssText="display:flex;align-items:center;gap:10px;flex:1;min-width:0";info.innerHTML='<img src="'+s.img+'"><div style="flex:1;min-width:0"><b>'+s.name+'</b><br><small>'+s.set+' • '+s.fnd+'/'+s.tot+' ('+pc+'%)</small><div class="br2"><div style="width:'+pc+'%"></div></div></div>';d.appendChild(info);const dl=document.createElement("button");dl.textContent="🗑️";dl.style.background="#fee2e2";dl.onclick=e=>{e.stopPropagation();if(confirm(s.name+" löschen?")){const a=JSON.parse(localStorage.rb_sets||"{}");delete a[s.set];localStorage.rb_sets=JSON.stringify(a);delete localStorage["counts_"+s.set];cS.textContent=Object.keys(a).length;renderSets()}};d.appendChild(dl);sLst.appendChild(d)})}
function render(){gd.innerHTML="";let t=0,f=0;parts.filter(p=>!p.isFig).forEach(p=>{t+=p.quantity;f+=Math.min(counts[p.id]||0,p.quantity)});const fl=sCol==="ALL"?parts:(sCol==="🧩 Figuren-Teile"?parts.filter(p=>p.isFP):parts.filter(p=>p.color.name===sCol)),ms=fl.filter(p=>(counts[p.id]||0)<p.quantity),dn=fl.filter(p=>(counts[p.id]||0)>=p.quantity);document.getElementById("cM").textContent=String(ms.length);document.getElementById("cD").textContent=String(dn.length);cnt.textContent="Gesamt: "+f+" / "+t+" Steine";allBox.style.display=(tab==="miss"&&ms.length>0)?"flex":"none";let lg=null,bh=0;(tab==="miss"?ms:dn).forEach(i=>{if(i.fg&&i.fg!==lg){const h=document.createElement("div");h.className="sh";h.textContent="🧍 "+i.fg;gd.appendChild(h);lg=i.fg}else if(!i.fg&&!bh&&lg!==null){const h=document.createElement("div");h.className="sh bk";h.textContent="🧱 Reguläre Set-Steine";gd.appendChild(h);bh=1}const dq=Math.min(counts[i.id]||0,i.quantity),rm=i.quantity-dq,idn=tab==="done",c=document.createElement("div");c.className="cd"+(idn?" dn":(i.isFig?" fg":(i.isFP?" fp":"")));let prog="";if(!idn&&i.quantity>1){if(i.quantity<=12){let ds="";for(let n=0;n<i.quantity;n++)ds+='<span class="dot'+(n<dq?' ok':'')+'"></span>';prog='<div class="dots">'+ds+'</div>'}else{const pc=Math.round(dq/i.quantity*100);prog='<div class="pbar"><div class="pbar-t">'+dq+' gefunden • '+rm+' fehlen</div><div class="pbar-b"><div style="width:'+pc+'%"></div></div></div>'}}const qTxt=idn?(i.quantity+'× gefunden'):(dq>0?'Noch '+rm+'×':i.quantity+'×');c.innerHTML='<img src="'+(i.part.part_img_url||H+"/static/img/nil.png")+'" loading="lazy"><div class="qt'+(!idn&&dq?' pt':'')+'">'+qTxt+'</div>'+prog+'<div class="nm">'+i.part.name+'</div><div class="cl">'+i.color.name+'</div>';const br=document.createElement("div");br.className="brow";if(idn){const b=document.createElement("button");b.className="bs";b.textContent="↩️ Zurück";b.onclick=e=>{e.stopPropagation();if(confirm(i.part.name+" zurück?")){delete counts[i.id];save(i.id);render()}};br.appendChild(b);c.appendChild(br)}else{c.onclick=()=>{counts[i.id]=dq+1;save(i.id);render()};if(dq>0){const u=document.createElement("button");u.className="bs undo";u.textContent="-1";u.title="Einen wieder abziehen";u.onclick=e=>{e.stopPropagation();counts[i.id]=dq-1;if(counts[i.id]<=0)delete counts[i.id];save(i.id);render()};br.appendChild(u)}if(rm>1){const b=document.createElement("button");b.className="bs";b.textContent="✓ Alle ("+rm+")";b.onclick=e=>{e.stopPropagation();counts[i.id]=i.quantity;save(i.id);render()};br.appendChild(b)}if(br.children.length)c.appendChild(br)}gd.appendChild(c)})}
</script>
</body>
</html>
